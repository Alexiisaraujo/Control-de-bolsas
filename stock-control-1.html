<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1f2e">
<title>Mi Stock</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #1a1f2e;
  --surface:  #242938;
  --card:     #2c3347;
  --border:   #363d54;
  --green:    #22c55e;
  --green-bg: #15803d22;
  --red:      #ef4444;
  --red-bg:   #b9191922;
  --yellow:   #f59e0b;
  --blue:     #3b82f6;
  --text:     #f1f5f9;
  --muted:    #94a3b8;
  --radius:   20px;
  --font:     'Nunito', sans-serif;
}

html, body {
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}

/* ── HEADER ── */
.header {
  background: var(--surface);
  border-bottom: 2px solid var(--border);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 20;
}
.header-title {
  font-size: 24px;
  font-weight: 900;
  display: flex;
  align-items: center;
  gap: 10px;
}
.header-datetime {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 1px;
}
.header-time {
  font-size: 18px;
  font-weight: 900;
  color: var(--text);
  line-height: 1;
}
.header-date {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  text-transform: capitalize;
  letter-spacing: .5px;
}
.btn-icon {
  width: 46px; height: 46px;
  border-radius: 14px;
  border: 2px solid var(--border);
  background: var(--card);
  color: var(--muted);
  font-size: 20px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.btn-icon:active { transform: scale(.9); }

/* ── MAIN ── */
.main {
  padding: 16px 14px 120px;
  display: flex; flex-direction: column; gap: 14px;
}

/* ── EMPTY ── */
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty .empty-icon { font-size: 64px; margin-bottom: 16px; }
.empty p { font-size: 18px; font-weight: 800; margin-bottom: 8px; color: var(--text); }
.empty span { font-size: 15px; font-weight: 600; }

/* ── CARD ── */
.card {
  background: var(--card);
  border-radius: var(--radius);
  border: 2px solid var(--border);
  overflow: hidden;
  transition: border-color .3s, box-shadow .3s;
  animation: slideIn .3s ease both;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
.card.ok  { border-color: var(--green); box-shadow: 0 4px 20px #22c55e20; }
.card.low { border-color: var(--red);   box-shadow: 0 4px 20px #ef444425; }

/* ── CARD TOP ── */
.card-top {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 8px;
}
.card-info { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.card-emoji { font-size: 30px; flex-shrink: 0; }
.card-name { font-size: 19px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.badge {
  font-size: 13px; font-weight: 800;
  padding: 5px 12px; border-radius: 40px; flex-shrink: 0;
}
.badge.ok  { background: var(--green-bg); color: var(--green); }
.badge.low { background: var(--red-bg);   color: var(--red); animation: blink .9s ease infinite alternate; }
@keyframes blink { from { opacity: .7; } to { opacity: 1; } }

/* ── PROGRESS ── */
.progress-wrap {
  margin: 0 16px 4px; height: 8px;
  background: var(--border); border-radius: 99px; overflow: hidden;
}
.progress-bar { height: 100%; border-radius: 99px; transition: width .4s ease, background .3s; }

/* ── QTY AREA ── */
.qty-area {
  display: flex; align-items: center; justify-content: center;
  gap: 14px; padding: 10px 16px 6px;
}
.side-btns { display: flex; flex-direction: column; gap: 6px; }
.btn-side {
  width: 64px; height: 48px; border-radius: 14px; border: none;
  font-family: var(--font); font-weight: 900; font-size: 16px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: transform .1s, opacity .1s;
}
.btn-side:active { transform: scale(.88); opacity: .85; }
.btn-add-1  { background: var(--green); color: #fff; font-size: 24px; }
.btn-add-10 { background: #15803d;      color: #86efac; font-size: 14px; }
.btn-sub-1  { background: #374151;      color: var(--text); font-size: 24px; }
.btn-sub-10 { background: #1f2937;      color: var(--muted); font-size: 14px; border: 1px solid var(--border); }

.qty-display { display: flex; flex-direction: column; align-items: center; min-width: 100px; }
.qty-number {
  font-size: 72px; font-weight: 900; line-height: 1; transition: color .3s;
}
.qty-number.ok  { color: var(--green); }
.qty-number.low { color: var(--red); }
.qty-number.bump { animation: bump .2s ease; }
@keyframes bump {
  0%  { transform: scale(1); }
  40% { transform: scale(1.18); }
  100%{ transform: scale(1); }
}
.qty-label { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }

/* ── CUSTOM AMOUNT ── */
.custom-row {
  display: flex; gap: 8px; padding: 8px 16px; align-items: center;
}
.custom-input {
  flex: 1; background: var(--surface); border: 2px solid var(--border);
  border-radius: 12px; color: var(--text); font-family: var(--font);
  font-size: 17px; font-weight: 700; padding: 10px 12px; text-align: center;
  -moz-appearance: textfield; transition: border-color .2s;
}
.custom-input::-webkit-inner-spin-button,
.custom-input::-webkit-outer-spin-button { -webkit-appearance: none; }
.custom-input:focus { outline: none; border-color: var(--blue); }
.custom-input::placeholder { color: var(--muted); font-weight: 600; font-size: 13px; }
.btn-custom {
  height: 48px; padding: 0 14px; border-radius: 12px; border: none;
  font-family: var(--font); font-size: 14px; font-weight: 800;
  cursor: pointer; transition: transform .1s, opacity .1s; white-space: nowrap;
}
.btn-custom:active { transform: scale(.92); opacity: .85; }
.btn-custom.add { background: var(--green); color: #fff; }
.btn-custom.sub { background: #374151;      color: var(--text); }

/* ── CARD BOTTOM (mínimo) ── */
.card-bottom {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px 14px;
  border-top: 2px solid var(--border); margin-top: 6px; gap: 10px;
  flex-wrap: wrap;
}
.min-text { font-size: 14px; font-weight: 700; color: var(--muted); }
.min-text strong { color: var(--text); }
.min-edit-row { display: flex; gap: 8px; align-items: center; }
.min-input {
  width: 70px; background: var(--surface); border: 2px solid var(--border);
  border-radius: 10px; color: var(--text); font-family: var(--font);
  font-size: 16px; font-weight: 700; padding: 7px 8px; text-align: center;
  -moz-appearance: textfield; transition: border-color .2s;
}
.min-input::-webkit-inner-spin-button,
.min-input::-webkit-outer-spin-button { -webkit-appearance: none; }
.min-input:focus { outline: none; border-color: var(--blue); }
.btn-min-save {
  background: var(--blue); border: none; border-radius: 10px;
  color: #fff; font-family: var(--font); font-size: 13px; font-weight: 800;
  padding: 8px 14px; cursor: pointer; transition: opacity .15s, transform .1s;
}
.btn-min-save:active { opacity: .8; transform: scale(.95); }

/* ── FAB ── */
.fab {
  position: fixed; bottom: 24px; right: 20px; z-index: 30;
  width: 64px; height: 64px; border-radius: 50%;
  background: var(--blue); color: #fff;
  font-size: 32px; border: none; cursor: pointer;
  box-shadow: 0 8px 24px #3b82f640;
  display: flex; align-items: center; justify-content: center;
  transition: transform .15s, box-shadow .15s;
}
.fab:active { transform: scale(.9); }

/* ── DRAWER ── */
.drawer-overlay {
  display: none; position: fixed; inset: 0;
  background: #00000090; z-index: 40;
  backdrop-filter: blur(4px); animation: fadeIn .2s ease;
}
.drawer-overlay.open { display: flex; align-items: flex-end; justify-content: center; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.drawer {
  background: var(--surface);
  border-top-left-radius: 28px; border-top-right-radius: 28px;
  border: 2px solid var(--border); border-bottom: none;
  width: 100%; max-width: 500px;
  padding: 12px 20px 44px;
  animation: slideUp .25s ease;
  max-height: 92vh; overflow-y: auto;
}
@keyframes slideUp {
  from { transform: translateY(80px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}
.drawer-handle {
  width: 40px; height: 5px; background: var(--border);
  border-radius: 99px; margin: 0 auto 14px;
}
.drawer-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px;
}
.drawer-title { font-size: 22px; font-weight: 900; }
.btn-drawer-close {
  display: flex; align-items: center; gap: 6px;
  background: var(--card); border: 2px solid var(--border);
  border-radius: 12px; color: var(--text);
  font-family: var(--font); font-size: 15px; font-weight: 800;
  padding: 8px 14px; cursor: pointer;
  transition: background .15s, transform .1s;
}
.btn-drawer-close:active { transform: scale(.93); background: var(--border); }
.drawer-section { margin-bottom: 28px; }
.drawer-section h3 {
  font-size: 13px; font-weight: 800; color: var(--muted);
  text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 14px;
  padding-bottom: 8px; border-bottom: 2px solid var(--border);
}

/* ── EMOJI GRID ── */
.emoji-grid {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 6px; margin-bottom: 14px;
}
.emoji-btn {
  aspect-ratio: 1; border-radius: 10px;
  border: 2px solid transparent; background: var(--card);
  font-size: 22px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: border-color .15s, transform .1s;
}
.emoji-btn:active { transform: scale(.88); }
.emoji-btn.selected { border-color: var(--blue); background: #3b82f620; }

/* ── DRAWER INPUTS ── */
.input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.input-label {
  font-size: 13px; font-weight: 800; color: var(--muted);
  text-transform: uppercase; letter-spacing: 1px;
}
.input-field {
  background: var(--card); border: 2px solid var(--border);
  border-radius: 14px; color: var(--text); font-family: var(--font);
  font-size: 18px; font-weight: 700; padding: 12px 16px; width: 100%;
  -moz-appearance: textfield; transition: border-color .2s;
}
.input-field::-webkit-inner-spin-button,
.input-field::-webkit-outer-spin-button { -webkit-appearance: none; }
.input-field:focus { outline: none; border-color: var(--blue); }
.input-field::placeholder { color: var(--muted); font-weight: 600; }

.btn-drawer-add {
  width: 100%; padding: 16px; border-radius: 16px; border: none;
  background: var(--blue); color: #fff; font-family: var(--font);
  font-size: 18px; font-weight: 900; cursor: pointer;
  transition: opacity .15s, transform .1s;
}
.btn-drawer-add:active { opacity: .85; transform: scale(.98); }

/* ── PRODUCT LIST (eliminar) ── */
.product-list-item {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--card); border-radius: 14px;
  padding: 12px 14px; margin-bottom: 8px; border: 2px solid var(--border);
}
.product-list-info { display: flex; align-items: center; gap: 10px; }
.product-list-emoji { font-size: 24px; }
.product-list-name { font-size: 16px; font-weight: 800; }
.btn-delete {
  width: 42px; height: 42px; border-radius: 10px;
  background: var(--red-bg); border: 2px solid #ef444440;
  color: var(--red); font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform .1s;
}
.btn-delete:active { transform: scale(.88); }

/* ── MODAL ── */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: #00000090; z-index: 50;
  align-items: center; justify-content: center;
  padding: 20px; backdrop-filter: blur(4px);
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface); border-radius: 24px;
  border: 2px solid var(--border); padding: 28px 24px;
  width: 100%; max-width: 360px; animation: popIn .2s ease;
}
@keyframes popIn {
  from { transform: scale(.9); opacity: 0; }
  to   { transform: scale(1);  opacity: 1; }
}
.modal-icon { font-size: 48px; text-align: center; margin-bottom: 12px; }
.modal-title { font-size: 20px; font-weight: 900; text-align: center; margin-bottom: 8px; }
.modal-msg {
  font-size: 15px; color: var(--muted); text-align: center;
  line-height: 1.5; margin-bottom: 24px; font-weight: 600;
}
.modal-btns { display: flex; gap: 10px; }
.modal-cancel, .modal-confirm {
  flex: 1; padding: 14px; border-radius: 14px;
  font-family: var(--font); font-size: 16px; font-weight: 800; cursor: pointer;
  transition: opacity .15s;
}
.modal-cancel  { border: 2px solid var(--border); background: var(--card); color: var(--text); }
.modal-confirm { border: none; background: var(--red); color: #fff; }
.modal-cancel:active, .modal-confirm:active { opacity: .8; }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 30px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: #0f172a; border: 2px solid var(--border);
  color: var(--text); font-family: var(--font);
  font-size: 15px; font-weight: 800;
  padding: 12px 22px; border-radius: 40px;
  z-index: 60; opacity: 0; pointer-events: none; white-space: nowrap;
  transition: transform .3s cubic-bezier(.34,1.56,.64,1), opacity .3s;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">📦 Mi Stock</div>
  <div class="header-datetime">
    <div class="header-time" id="clock">--:--</div>
    <div class="header-date" id="dateline">---</div>
  </div>
  <button class="btn-icon" id="btn-reset-all" title="Resetear todo">🔄</button>
</div>

<div class="main" id="cards-container"></div>

<button class="fab" id="btn-open-drawer" title="Agregar producto">＋</button>

<!-- DRAWER -->
<div class="drawer-overlay" id="drawer-overlay">
  <div class="drawer">
    <div class="drawer-handle"></div>
    <div class="drawer-header">
      <div class="drawer-title">✏️ Gestionar productos</div>
      <button class="btn-drawer-close" id="btn-close-drawer">← Volver</button>
    </div>

    <div class="drawer-section">
      <h3>➕ Agregar nuevo producto</h3>
      <div class="input-group">
        <div class="input-label">Ícono</div>
        <div class="emoji-grid" id="emoji-grid"></div>
      </div>
      <div class="input-group">
        <div class="input-label">Nombre del producto</div>
        <input class="input-field" type="text" id="new-name" placeholder="Ej: Caja Grande" maxlength="30">
      </div>
      <div class="input-group">
        <div class="input-label">Stock mínimo</div>
        <input class="input-field" type="number" id="new-min" placeholder="Ej: 10" min="0">
      </div>
      <button class="btn-drawer-add" id="btn-add-product">✅ Agregar producto</button>
    </div>

    <div class="drawer-section">
      <h3>🗑️ Eliminar producto</h3>
      <div id="product-list-drawer"></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-icon" id="modal-icon">⚠️</div>
    <div class="modal-title" id="modal-title">Atención</div>
    <div class="modal-msg" id="modal-msg"></div>
    <div class="modal-btns">
      <button class="modal-cancel" id="modal-cancel">Cancelar</button>
      <button class="modal-confirm" id="modal-confirm">Confirmar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── DATOS ──
const DEFAULTS = [
  { id: 'bolsa1', name: 'Bolsa Tipo 1', qty: 0, min: 10, emoji: '🛍️' },
  { id: 'bolsa2', name: 'Bolsa Tipo 2', qty: 0, min: 10, emoji: '🛍️' },
  { id: 'bolsa3', name: 'Bolsa Tipo 3', qty: 0, min: 10, emoji: '🛍️' },
  { id: 'bobina', name: 'Bobina',       qty: 0, min: 5,  emoji: '🧻' },
];
const EMOJIS = ['📦','🛍️','🧻','🗂️','🔩','🧴','🧪','🥫','🍶','🖊️','✂️','🧲','⚙️','🔑','🏷️','🧺','🪣','🧹','🪝','🔋','💡','🖨️','📋','📌','🧯','🪤','🧱','🎁'];

let state = loadState();
let selectedEmoji = '📦';

function loadState() {
  try { const s = localStorage.getItem('stockctl_v2'); if (s) return JSON.parse(s); } catch(e) {}
  return DEFAULTS.map(d => ({...d}));
}
function saveState() { localStorage.setItem('stockctl_v2', JSON.stringify(state)); }
function uid() { return 'p_' + Date.now() + Math.random().toString(36).slice(2,6); }

// ── MODAL ──
let modalResolve = null;
function showModal(icon, title, msg) {
  document.getElementById('modal-icon').textContent  = icon;
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-msg').textContent   = msg;
  document.getElementById('modal-overlay').classList.add('open');
  return new Promise(res => { modalResolve = res; });
}
document.getElementById('modal-cancel').onclick  = () => closeModal(false);
document.getElementById('modal-confirm').onclick = () => closeModal(true);
document.getElementById('modal-overlay').onclick = (e) => { if (e.target === e.currentTarget) closeModal(false); };
function closeModal(val) {
  document.getElementById('modal-overlay').classList.remove('open');
  if (modalResolve) { modalResolve(val); modalResolve = null; }
}

// ── TOAST ──
let toastT;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 2200);
}

// ── HELPERS ──
function getStatus(item) { return item.qty >= item.min ? 'ok' : 'low'; }
function getPct(item) {
  if (item.min === 0) return 100;
  return Math.min(100, Math.round((item.qty / item.min) * 100));
}
function getBarColor(item) {
  const p = getPct(item);
  if (p >= 100) return 'var(--green)';
  if (p >= 50)  return 'var(--yellow)';
  return 'var(--red)';
}

// ── RENDER CARDS ──
function renderAll() {
  const c = document.getElementById('cards-container');
  c.innerHTML = '';
  if (state.length === 0) {
    c.innerHTML = `<div class="empty">
      <div class="empty-icon">📭</div>
      <p>No hay productos todavía</p>
      <span>Tocá el botón <strong>＋</strong> para agregar uno</span>
    </div>`;
    return;
  }
  state.forEach((item, idx) => {
    const st = getStatus(item);
    const pct = getPct(item);
    const card = document.createElement('div');
    card.className = `card ${st}`;
    card.dataset.idx = idx;
    card.style.animationDelay = `${idx * 0.05}s`;
    card.innerHTML = `
      <div class="card-top">
        <div class="card-info">
          <span class="card-emoji">${item.emoji || '📦'}</span>
          <span class="card-name">${item.name}</span>
        </div>
        <div class="badge ${st}">${st === 'ok' ? '✅ OK' : '⚠️ BAJO'}</div>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar" style="width:${pct}%; background:${getBarColor(item)}"></div>
      </div>
      <div class="qty-area">
        <div class="side-btns">
          <button class="btn-side btn-add-10" data-idx="${idx}" data-delta="10">+10</button>
          <button class="btn-side btn-add-1"  data-idx="${idx}" data-delta="1">＋</button>
        </div>
        <div class="qty-display">
          <div class="qty-number ${st}" id="qty-${idx}">${item.qty}</div>
          <div class="qty-label">unidades</div>
        </div>
        <div class="side-btns">
          <button class="btn-side btn-sub-1"  data-idx="${idx}" data-delta="-1">－</button>
          <button class="btn-side btn-sub-10" data-idx="${idx}" data-delta="-10">−10</button>
        </div>
      </div>
      <div class="custom-row">
        <input class="custom-input" type="number" min="0" placeholder="Cantidad..." id="custom-${idx}">
        <button class="btn-custom add" data-idx="${idx}" data-action="add">＋ Agregar</button>
        <button class="btn-custom sub" data-idx="${idx}" data-action="sub">－ Sacar</button>
      </div>
      <div class="card-bottom">
        <span class="min-text">🔔 Mínimo: <strong>${item.min}</strong></span>
        <div class="min-edit-row">
          <input class="min-input" type="number" min="0" value="${item.min}" id="min-input-${idx}" data-idx="${idx}">
          <button class="btn-min-save" data-idx="${idx}">💾 Guardar</button>
        </div>
      </div>
    `;
    c.appendChild(card);
  });
  attachCardEvents();
}

// ── UPDATE CARD ──
function updateCard(idx) {
  const item = state[idx];
  const st   = getStatus(item);
  const pct  = getPct(item);
  const card = document.querySelector(`.card[data-idx="${idx}"]`);
  if (!card) { renderAll(); return; }

  card.className = `card ${st}`;
  const badge = card.querySelector('.badge');
  badge.className = `badge ${st}`;
  badge.textContent = st === 'ok' ? '✅ OK' : '⚠️ BAJO';

  const qtyEl = card.querySelector('.qty-number');
  qtyEl.textContent = item.qty;
  qtyEl.className = `qty-number ${st} bump`;
  setTimeout(() => qtyEl.classList.remove('bump'), 220);

  const bar = card.querySelector('.progress-bar');
  bar.style.width      = pct + '%';
  bar.style.background = getBarColor(item);

  const minStrong = card.querySelector('.min-text strong');
  if (minStrong) minStrong.textContent = item.min;
}

// ── CARD EVENTS ──
function attachCardEvents() {
  document.querySelectorAll('.btn-side').forEach(btn => {
    btn.addEventListener('click', () => handleDelta(parseInt(btn.dataset.idx), parseInt(btn.dataset.delta)));
  });

  document.querySelectorAll('.btn-custom').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx    = parseInt(btn.dataset.idx);
      const action = btn.dataset.action;
      const input  = document.getElementById(`custom-${idx}`);
      const val    = parseInt(input.value);
      if (!val || val <= 0) { showToast('⚠️ Ingresá una cantidad válida'); return; }
      handleDelta(idx, action === 'add' ? val : -val);
      input.value = '';
    });
  });

  document.querySelectorAll('.btn-min-save').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.idx);
      const val = parseInt(document.getElementById(`min-input-${idx}`).value);
      if (isNaN(val) || val < 0) { showToast('⚠️ Ingresá un mínimo válido'); return; }
      state[idx].min = val;
      saveState();
      updateCard(idx);
      showToast('✅ Mínimo guardado');
    });
  });

  document.querySelectorAll('.min-input').forEach(input => {
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        document.querySelector(`.btn-min-save[data-idx="${input.dataset.idx}"]`).click();
        input.blur();
      }
    });
  });
}

async function handleDelta(idx, delta) {
  const item = state[idx];
  const next = item.qty + delta;
  if (next < 0) {
    const ok = await showModal('😬', 'No puede quedar negativo', `"${item.name}" no puede tener stock negativo. ¿Lo dejamos en 0?`);
    if (ok) { state[idx].qty = 0; saveState(); updateCard(idx); showToast('Stock → 0'); }
    return;
  }
  state[idx].qty = next;
  saveState();
  updateCard(idx);
}

// ── RESET ──
document.getElementById('btn-reset-all').addEventListener('click', async () => {
  const ok = await showModal('🔄', '¿Resetear todo el stock?', 'Se va a poner en 0 el stock de TODOS los productos. Los mínimos no cambian.');
  if (ok) {
    state.forEach(item => { item.qty = 0; });
    saveState(); renderAll();
    showToast('🔄 Stock reseteado a 0');
  }
});

// ── RELOJ ──
function updateClock() {
  const now = new Date();
  const hh  = String(now.getHours()).padStart(2, '0');
  const mm  = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('clock').textContent = `${hh}:${mm}`;
  const dias   = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const meses  = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const dia    = dias[now.getDay()];
  const fecha  = now.getDate();
  const mes    = meses[now.getMonth()];
  const anio   = now.getFullYear();
  document.getElementById('dateline').textContent = `${dia} ${fecha} ${mes} ${anio}`;
}
updateClock();
setInterval(updateClock, 10000);

// ── DRAWER ──
function openDrawer() {
  renderEmojiGrid();
  renderDrawerProductList();
  document.getElementById('new-name').value = '';
  document.getElementById('new-min').value  = '';
  document.getElementById('drawer-overlay').classList.add('open');
}
function closeDrawer() {
  document.getElementById('drawer-overlay').classList.remove('open');
}
document.getElementById('btn-open-drawer').addEventListener('click', openDrawer);
document.getElementById('btn-close-drawer').addEventListener('click', closeDrawer);
document.getElementById('drawer-overlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeDrawer();
});

function renderEmojiGrid() {
  const grid = document.getElementById('emoji-grid');
  grid.innerHTML = '';
  EMOJIS.forEach(em => {
    const btn = document.createElement('button');
    btn.className = 'emoji-btn' + (em === selectedEmoji ? ' selected' : '');
    btn.textContent = em;
    btn.onclick = () => {
      selectedEmoji = em;
      document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    };
    grid.appendChild(btn);
  });
}

function renderDrawerProductList() {
  const list = document.getElementById('product-list-drawer');
  list.innerHTML = '';
  if (state.length === 0) {
    list.innerHTML = '<p style="color:var(--muted);font-size:14px;font-weight:700;text-align:center;padding:10px 0">No hay productos cargados</p>';
    return;
  }
  state.forEach((item, idx) => {
    const row = document.createElement('div');
    row.className = 'product-list-item';
    row.innerHTML = `
      <div class="product-list-info">
        <span class="product-list-emoji">${item.emoji || '📦'}</span>
        <span class="product-list-name">${item.name}</span>
      </div>
      <button class="btn-delete" data-idx="${idx}">🗑️</button>
    `;
    list.appendChild(row);
  });
  list.querySelectorAll('.btn-delete').forEach(btn => {
    btn.addEventListener('click', async () => {
      const idx  = parseInt(btn.dataset.idx);
      const name = state[idx].name;
      const ok   = await showModal('🗑️', '¿Eliminar producto?', `Se va a eliminar "${name}" y su stock. Esta acción no se puede deshacer.`);
      if (ok) {
        state.splice(idx, 1);
        saveState(); renderAll(); renderDrawerProductList();
        showToast(`🗑️ "${name}" eliminado`);
      }
    });
  });
}

document.getElementById('btn-add-product').addEventListener('click', () => {
  const name = document.getElementById('new-name').value.trim();
  const minV = parseInt(document.getElementById('new-min').value);
  if (!name) { showToast('✏️ Escribí un nombre para el producto'); return; }
  if (isNaN(minV) || minV < 0) { showToast('⚠️ Ingresá un stock mínimo válido'); return; }
  if (state.some(s => s.name.toLowerCase() === name.toLowerCase())) {
    showToast('⚠️ Ya existe un producto con ese nombre'); return;
  }
  state.push({ id: uid(), name, qty: 0, min: minV, emoji: selectedEmoji });
  saveState(); renderAll(); renderDrawerProductList();
  document.getElementById('new-name').value = '';
  document.getElementById('new-min').value  = '';
  showToast(`✅ "${name}" agregado`);
});

// ── INIT ──
renderAll();
</script>
</body>
</html>
